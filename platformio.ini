[platformio]
default_envs = esp32-cyd-024

[env:esp32-cyd-024]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

; ESP32-2432S024 uses the classic ESP32 and a 4 MiB flash layout with
; one 2 MiB application slot and a FAT data partition for FFat.
board_upload.flash_size = 4MB
board_build.partitions = partitions-ffat.csv
board_build.filesystem = fatfs
monitor_speed = 115200
upload_speed = 460800

lib_deps =
      TFT_eSPI@2.5.43
      https://github.com/TheNitek/XPT2046_Bitbang_Arduino_Library.git#1a1d20c
      https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ESPping@1.0.5
    https://github.com/lucadentella/TOTP-Arduino.git#afec486
    PNGdec@1.1.6
    JPEGDEC@1.8.4
    earlephilhower/ESP8266Audio@2.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -I$PROJECT_DIR/TFT_eSPI
    -include$PROJECT_DIR/src/forward_declarations.h
